<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASHA AUTO MINING</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; padding: 0; background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center; overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        .container { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 20px; box-sizing: border-box; }
        .score-section { margin-top: 30px; }
        .score-title { font-size: 14px; color: #8a8aab; letter-spacing: 1px; }
        .score-value { font-size: 42px; font-weight: bold; margin-top: 5px; color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        
        .mining-section { display: flex; flex-direction: column; justify-content: center; align-items: center; flex-grow: 1; }
        .coin-wrapper { position: relative; }
        .coin {
            width: 200px; height: 200px; background: radial-gradient(circle, #ffe066 0%, #f5b041 70%, #d35400 100%);
            border-radius: 50%; box-shadow: 0 0 30px rgba(245, 176, 65, 0.5);
            display: flex; justify-content: center; align-items: center; font-size: 60px;
            border: 8px solid #f39c12; animation: spin 8s linear infinite; cursor: pointer;
            transition: transform 0.1s;
        }
        .coin:active { transform: scale(0.95) rotateY(10deg); }
        
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .tank-section { margin-top: 20px; width: 260px; }
        .tank-title { font-size: 14px; color: #aeb6bf; margin-bottom: 5px; }
        .tank-value { font-size: 24px; font-weight: bold; color: #2ecc71; margin-bottom: 10px; }
        
        .claim-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none; color: white; padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.1s ease, filter 0.2s; width: 100%; margin-top: 5px;
        }
        .claim-btn:active { transform: scale(0.98); }
        .claim-btn:disabled { background: #566573; box-shadow: none; cursor: not-allowed; color: #bdc3c7; }

        .footer-info { margin-bottom: 20px; color: #7f8c8d; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="score-section">
            <div class="score-title">TOTAL PASHA BALANCE</div>
            <div id="score" class="score-value">0</div>
        </div>

        <div class="mining-section">
            <div class="coin-wrapper">
                <div id="coin" class="coin">💎</div>
            </div>
            
            <div class="tank-section">
                <div class="tank-title">⛏️ Mined (In Tank)</div>
                <div id="tank" class="tank-value">0 / 500</div>
                <button id="claim-button" class="claim-btn" disabled>📥 Claim / برداشت</button>
            </div>
        </div>

        <div class="footer-info">
            ⚡ Mining status: <span id="status-text" style="color: #2ecc71;">Active (+1/s) ✅</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand(); 
            tg.ready();
        }

        // لود مقادیر اولیه از حافظه
        let totalScore = parseInt(localStorage.getItem('pasha_total_score')) || 0;
        let tankScore = parseInt(localStorage.getItem('pasha_tank_score')) || 0;
        let maxTank = 500; 

        // 🌟 بخش اصلی: محاسبه ماینینگ زمان غیبت کاربر (Offline Mining)
        const lastSavedTime = localStorage.getItem('pasha_last_time');
        if (lastSavedTime) {
            const currentTime = Math.floor(Date.now() / 1000); // زمان فعلی به ثانیه
            const secondsPassed = currentTime - parseInt(lastSavedTime); // محاسبه ثانیه‌های سپری شده
            
            if (secondsPassed > 0) {
                // اضافه کردن امتیازهای زمان غیبت به مخزن تا سقف مجاز
                tankScore = Math.min(maxTank, tankScore + secondsPassed);
            }
        }

        const scoreEl = document.getElementById('score');
        const tankEl = document.getElementById('tank');
        const claimButton = document.getElementById('claim-button');
        const coinEl = document.getElementById('coin');

        function updateUI() {
            scoreEl.innerText = totalScore.toLocaleString();
            tankEl.innerText = tankScore + " / " + maxTank;
            claimButton.disabled = (tankScore === 0);

            // ذخیره مداوم وضعیت و زمان فعلی
            localStorage.setItem('pasha_total_score', totalScore);
            localStorage.setItem('pasha_tank_score', tankScore);
            localStorage.setItem('pasha_last_time', Math.floor(Date.now() / 1000));
        }

        // موتور استخراج زنده (زمانی که برنامه باز است)
        setInterval(() => {
            if (tankScore < maxTank) {
                tankScore += 1;
                updateUI();
            } else {
                // حتی اگر مخزن پر باشد، زمان آخر را ذخیره کن تا باگ زمانی پیش نیاید
                localStorage.setItem('pasha_last_time', Math.floor(Date.now() / 1000));
            }
        }, 1000);

        // اجرای اولین به‌روزرسانی
        updateUI();

        // برداشت امتیازها
        claimButton.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (tankScore > 0) {
                totalScore += tankScore; 
                let claimedAmount = tankScore;
                tankScore = 0; 
                updateUI();

                if (tg && tg.showAlert) {
                    tg.showAlert(`✅ تعداد ${claimedAmount} امتیاز با موفقیت به حساب شما واریز شد!`);
                } else {
                    alert(`✅ تعداد ${claimedAmount} امتیاز برداشت شد!`);
                }
            }
        });
    </script>
</body>
</html>
